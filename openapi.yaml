
#Header
openapi: 3.1.0
info:
  title: Bootcamp API
  description: A REST API for browsing, managing, and enrolling in software development bootcamps and their associated courses.
  version: 1.0.0

  contact:
    name: Amarachi
    email: amarachiogueji@gmail.com

#Server
servers: 
  - url: http://localhost:3000/api/v1
    description: Local development server    

tags:
  - name: Bootcamps
    description: Create, read, update, and delete bootcamps.
  - name: Courses
    description: Manage the courses that belong to a bootcamp.  
  
#Paths
paths: 
  /bootcamps:
    get:
      summary: Get all bootcamps
      description: Returns a paginated list of all bootcamps. Use the page and limit query parameters to move through the results.
      operationId: getBootcamps
      tags:
        - Bootcamps
      parameters: 
        - name: page
          in: query
          schema:
            type: integer
            default: 1            
          description: The page number of results to return
        - name: limit
          in:  query
          schema:
            type: integer
            default: 25
          description: The limit number of items to return
      responses:
        '200':
          description: A list of bootcamps
          content:
            application/json: 
              schema: 
                type: object 
                properties:
                  success: 
                    type: boolean
                  count: 
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
              example: 
                success: true
                count: 4
                data:
                   - _id: "6a70215e62ad8dc8d3c95906"
                     name: "Devworks Bootcamp"
                     description: "Updated: Full stack JavaScript bootcamp with career support"
                     website: "https://devworks.com"
                     careers:
                       - "Web Development"
                       - "UI/UX"
                     createdAt: "2026-08-31T09:50:25.658Z"
    post:
      summary: Create a bootcamp
      description: Creates a new bootcamp. The name, description and careers fields are required.
      operationId: createBootcamp
      tags:
        - Bootcamps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                website:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                careers:
                  type: array
                  items:
                    type: string
            example:
              name: "Devworks Bootcamp"
              description: "Updated: Full stack JavaScript bootcamp with career support"
              website: "https://devworks.com"
              phone: "1234567890"
              email: "johndoe@gmail.com"
              careers:
                - "Web Development"
                - "UI/UX"
      responses:
        '201':
          description: Bootcamp created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                data:
                  _id: "6a70215e62ad8dc8d3c95906"
                  name: "Devworks Bootcamp"
                  description: "Updated: Full stack JavaScript bootcamp with career support"
                  website: "https://devworks.com"
                  phone: "1234567890"
                  email: "johndoe@gmail.com"
                  careers:
                    - "Web Development"
                    - "UI/UX"
                  createdAt: "2026-08-31T09:50:25.658Z" 
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              example:
                success: false
                error: "Bootcamp validation failed: name: Please add a name"                           
  /bootcamps/{id}:   
    get:
      summary: Get bootcamp by id
      description: Returns a single bootcamp by its ID. Returns a 404 if no bootcamp matches.
      operationId: getBootcamp
      tags:
        - Bootcamps
      parameters:    
        -  name: id
           in: path 
           schema:
             type: string
           description: A bootcamp id
           required: true        
      responses:
        '200':
          description: A single bootcamp
          content:
            application/json: 
              schema: 
                type: object 
                properties:
                  success: 
                    type: boolean                     
                  data:
                    type: object                    
              example: 
                success: true
                data:
                   _id: "6a70215e62ad8dc8d3c95906"
                   name: "Devworks Bootcamp"
                   description: "Updated: Full stack JavaScript bootcamp with career support"
                   website: "https://devworks.com"
                   careers:
                     - "Web Development"
                     - "UI/UX"
                   createdAt: "2026-08-31T09:50:25.658Z"
        '404':
          description: Missing bootcamp
          content:
            application/json: 
              schema: 
                type: object 
                properties:
                  success: 
                    type: boolean                     
                  error:  
                    type: string
              example: 
                success: false
                error: "Bootcamp not found with id of 6a70215e62ad8dc8d3c95906"
    put:
      summary: Update a bootcamp
      description: Updates an existing bootcamp. Send only the fields you want to change.
      operationId: updateBootcamp
      tags:
        - Bootcamps
      parameters:
        -  name: id
           in: path 
           schema:
             type: string
           description: A bootcamp id
           required: true           
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                website:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                careers:
                  type: array
                  items:
                    type: string
            example:                
              description: "Updated: Full stack JavaScript bootcamp with career support"                                               
      responses:
        '200':
          description: Bootcamp updated
          content:            
            application/json:               
              schema:                 
                type: object                 
                properties:                  
                  success:                     
                    type: boolean       
                  data:                    
                    type: object                                           
              example:                 
                success: true                
                data:                   
                   _id: "6a70215e62ad8dc8d3c95906"                   
                   name: "Devworks Bootcamp"                  
                   description: "Updated: Full stack JavaScript bootcamp with career support"                   
                   website: "https://devworks.com"                   
                   careers:                     
                     - "Web Development"                   
                     - "UI/UX"                                        
                   createdAt: "2026-08-31T09:50:25.658Z"        
        '404':
          description: Missing bootcamp
          content:            
            application/json:               
              schema:                 
                type: object                 
                properties:                  
                  success:                     
                    type: boolean                                 
                  error:                      
                    type: string              
              example:                 
                success: false                
                error: "Bootcamp not found with id of 6a70215e62ad8dc8d3c95906" 
    delete:
      summary: Delete a bootcamp
      description: Permanently deletes a bootcamp by its ID.
      operationId: deleteBootcamp
      tags:
        - Bootcamps
      parameters:
        - name: id
          in: path
          schema:
            type: string
          description: A bootcamp id
          required: true
      responses:
        '200':
          description: Bootcamp deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                data: {}
        '404':
          description: Missing bootcamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              example:
                success: false
                error: "Bootcamp not found with id of 6a70215e62ad8dc8d3c95906"
  /bootcamps/{bootcampId}/courses:
    get:
      summary: Get all courses under a bootcamp
      description: Returns all courses that belong to a bootcamp. Returns an empty list if the bootcamp has no courses.
      operationId: getCourses
      tags:
        - Courses
      parameters:
        - name: bootcampId
          in: path
          schema:
            type: string
          description: The ID of the bootcamp whose courses you want to list
          required: true
      responses:
        '200':
          description: A list of courses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
              example:
                success: true
                count: 1
                data:
                  - _id: "6a89391d7e6637fe01ec176c"
                    title: "Full Stack Web Development"
                    description: "Learn front and back end development"
                    weeks: 12
                    tuition: 9500
                    minimumSkill: "beginner"
                    bootcamp: "6a70215e62ad8dc8d3c95906"
                    createdAt: "2026-08-22T05:52:29.891Z"
    post:
      summary: Create a course under a bootcamp.
      description: Creates a new course under the bootcamp in the URL. The title and tuition fields are required.
      operationId: createCourse
      tags:
        - Courses
      parameters:
        - name: bootcampId
          in: path
          schema:
            type: string
          description: The ID of the bootcamp to add the course to.
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                weeks:
                  type: integer
                tuition:
                  type: integer
                minimumSkill:
                  type: string               
            example:
              title: "Full Stack Web Development"
              description: "Learn front and back end development"
              weeks: 12
              tuition: 9500
              minimumSkill: "beginner"             
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                data:
                  _id: "6a89391d7e6637fe01ec176c"
                  title: "Full Stack Web Development"
                  description: "Learn front and back end development"
                  weeks: 12
                  tuition: 9500
                  minimumSkill: "beginner" 
                  bootcamp: "6a70215e62ad8dc8d3c95906"
                  createdAt: "2026-08-22T05:52:29.891Z"
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              example:
                success: false                
                error: "Course validation failed: tuition: Path `tuition` is required., title: Please add a title"
  /courses/{id}:
    get:
      summary: Get a course by id
      description: Returns a single course by its ID. Returns a 404 if no course matches.
      operationId: getCourse   
      tags:
        - Courses
      parameters:    
        -  name: id
           in: path 
           schema:
             type: string
           description: A course id
           required: true        
      responses:
        '200':
          description: A single course 
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                data:
                  _id: "6a89391d7e6637fe01ec176c"
                  title: "Full Stack Web Development"
                  description: "Learn front and back end development"
                  weeks: 12
                  tuition: 9500
                  minimumSkill: "beginner" 
                  bootcamp: "6a70215e62ad8dc8d3c95906"
                  createdAt: "2026-08-22T05:52:29.891Z"
        '404':
          description: Missing course
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              example:
                success: false                
                error: "Course not found with id of 000000000000000000000000"
    put:
      summary: Update a course by id
      description: Updates an existing course. Send only the fields you want to change.
      operationId: updateCourse
      tags:
        - Courses
      parameters:    
        -  name: id
           in: path 
           schema:
             type: string
           description: A course id
           required: true  
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                weeks:
                  type: integer
                tuition:
                  type: integer
                minimumSkill:
                  type: string               
            example:
              tuition: 9500
      responses:
        '200':
          description: Course updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                data:
                  _id: "6a89391d7e6637fe01ec176c"
                  title: "Full Stack Web Development"
                  description: "Learn front and back end development"
                  weeks: 12
                  tuition: 9500
                  minimumSkill: "beginner" 
                  bootcamp: "6a70215e62ad8dc8d3c95906"
                  createdAt: "2026-08-22T05:52:29.891Z"
        '404':
          description: Missing course 
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              example:
                success: false                
                error: "Course not found with id of 000000000000000000000000" 
    delete:
      summary: Delete a course by id
      description: Permanently deletes a course by its ID.
      operationId: deleteCourse
      tags:
        - Courses
      parameters:    
        -  name: id
           in: path 
           schema:
             type: string
           description: A course id
           required: true  
      responses:
        '200':
          description: Course deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                data: {} 
        '404':
          description: Missing course
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              example:
                success: false                
                error: "Course not found with id of 000000000000000000000000"


components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
security:
  - ApiKeyAuth: []